{#- The Time Machine icon: a small spiral galaxy, tilted like a disc, slowly turning, with twinkling stars.
    Set galaxy_id (unique on the page) and optionally galaxy_size / galaxy_class before including. -#}
{%- set gid = galaxy_id|default("") -%}
<svg class="galaxy {{ galaxy_class|default('') }}" viewBox="0 0 24 24" width="{{ galaxy_size|default(20) }}" height="{{ galaxy_size|default(20) }}" aria-hidden="true">
  <defs>
    <linearGradient id="gx-arm{{ gid }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="gx-core{{ gid }}" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fde68a"/><stop offset=".7" stop-color="#f0abfc" stop-opacity=".55"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gx-halo{{ gid }}" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-24 12 12) matrix(1 0 0 .64 0 4.32)">
    <circle cx="12" cy="12" r="11" fill="url(#gx-halo{{ gid }})"/>
    <g class="gx-spin">
