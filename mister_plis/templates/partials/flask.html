{#- The feedback icon: a lab flask with a red (bug), orange (inconvenience) and green (idea) bubble rising out of it. -#}
<svg class="fb-flask" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
  <defs>
    <linearGradient id="fb-liquid{{ flask_id }}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0894ff"/><stop offset=".5" stop-color="#c959dd"/><stop offset="1" stop-color="#ff2e54"/>
    </linearGradient>
  </defs>
  <path class="fb-flask-liquid" d="M7.2 14h9.6l2.4 4.9a1.4 1.4 0 0 1-1.3 2H6.1a1.4 1.4 0 0 1-1.3-2z" fill="url(#fb-liquid{{ flask_id }})"/>
  <path d="M8.6 3h6.8M10 3v5.6l-5.5 10.4A1.8 1.8 0 0 0 6.1 21.6h11.8a1.8 1.8 0 0 0 1.6-2.6L14 8.6V3" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="fb-bubble b1" cx="9.6" cy="18" r="1.25" fill="#ff3b30"/>
  <circle class="fb-bubble b2" cx="14.2" cy="18.4" r="1.05" fill="#ff9500"/>
  <circle class="fb-bubble b3" cx="12" cy="16.4" r="0.95" fill="#34c759"/>
</svg>
